{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auto-monitor-k8s.fullname" . }}
  labels:
    {{- include "auto-monitor-k8s.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "auto-monitor-k8s.config" . | nindent 4 }}
{{- end }}
