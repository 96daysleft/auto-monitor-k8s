# Uptime Kuma login from OpenBao (kv path: auto-monitor-k8s)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auto-monitor-k8s-env
  namespace: auto-monitor-k8s
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-vault
    kind: ClusterSecretStore
  target:
    # Not "auto-monitor-k8s": the chart owns that Secret (rendered config.yaml)
    name: auto-monitor-k8s-env
    creationPolicy: Owner
  data:
  - secretKey: UPTIME_KUMA_USERNAME
    remoteRef:
      key: auto-monitor-k8s
      property: UPTIME_KUMA_USERNAME
  - secretKey: UPTIME_KUMA_PASSWORD
    remoteRef:
      key: auto-monitor-k8s
      property: UPTIME_KUMA_PASSWORD
